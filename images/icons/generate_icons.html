<!DOCTYPE html>
<html><head><title>MARE Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  // Background
  ctx.fillStyle = '#faf7f4';
  ctx.fillRect(0, 0, size, size);
  
  // Top accent line
  const grad = ctx.createLinearGradient(0, 0, size, 0);
  grad.addColorStop(0, '#f7ece9');
  grad.addColorStop(0.5, '#d89f95');
  grad.addColorStop(1, '#67826a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size * 0.02);
  
  // Text
  ctx.fillStyle = '#161322';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `300 ${size * 0.32}px Georgia, serif`;
  ctx.fillText('MARE', size / 2, size * 0.48);
  
  // Subtitle
  ctx.fillStyle = '#8a7e78';
  ctx.font = `300 ${size * 0.075}px sans-serif`;
  ctx.letterSpacing = `${size * 0.02}px`;
  ctx.fillText('ATELIER', size / 2, size * 0.65);
}

drawIcon(document.getElementById('c192'), 192);
drawIcon(document.getElementById('c512'), 512);

// Download links
['192', '512'].forEach(s => {
  const canvas = document.getElementById('c' + s);
  const link = document.createElement('a');
  link.download = 'icon-' + s + '.png';
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.textContent = 'Download ' + s;
  link.style.display = 'block';
  link.style.margin = '10px';
});
</script>
</body></html>
