<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>MARE Atelier</title>
  <meta name="description" content="Personal training companion" />
  <meta name="theme-color" content="#faf7f4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MARE" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="images/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=9" />
  <link rel="stylesheet" href="css/transitions.css?v=9" />
  <script>
    window.MareApp = window.MareApp || {
      _queued: null,
      navigateTo: function(v, el) { this._queued = { view: v, el: el }; },
      goHome: function() { this._queued = { view: 'home', el: null }; }
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        window.location.reload();
      });
    }
  </script>
</head>
<body>

  <!-- ═══════════════════ HOME VIEW ═══════════════════ -->
  <section class="view-container view-active" id="view-home">
    <header class="home-header">
      <h1 class="masthead">MARE</h1>
      <p class="masthead-sub">Atelier</p>
      <p class="today-label" id="home-today-label">Today's Training</p>
    </header>

    <div class="home-cards">
      <button class="home-card card-workouts" type="button" data-view="workouts" onclick="window.MareApp && window.MareApp.navigateTo('workouts', this)">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 5v14M18 5v14M2 9v6M22 9v6M6 12h12"/>
          </svg>
        </div>
        <h2 class="card-title">Workouts</h2>
        <p class="card-subtitle">Daily training sessions</p>
      </button>

      <button class="home-card card-log" type="button" data-view="log" onclick="window.MareApp && window.MareApp.navigateTo('log', this)">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <h2 class="card-title">History</h2>
        <p class="card-subtitle">Logged workout archive</p>
      </button>

      <button class="home-card card-customize" type="button" data-view="customize" onclick="window.MareApp && window.MareApp.navigateTo('customize', this)">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"/>
            <line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/>
            <line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
        </div>
        <h2 class="card-title">Customize</h2>
        <p class="card-subtitle">Routine builder & swaps</p>
      </button>

      <button class="home-card card-settings" type="button" data-view="settings" onclick="window.MareApp && window.MareApp.navigateTo('settings', this)">
        <div class="card-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <h2 class="card-title">Settings</h2>
        <p class="card-subtitle">Timer presets & backup</p>
      </button>
    </div>
  </section>

  <!-- ═══════════════════ WORKOUTS VIEW ═══════════════════ -->
  <section class="view-container" id="view-workouts">
    <header class="view-header">
      <button class="back-btn" aria-label="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Home</span>
      </button>
      <h1 class="view-title">Workouts</h1>
    </header>

    <div class="volume-toggle">
      <button class="vol-btn active" data-volume="vol1">Volume I</button>
      <button class="vol-btn" data-volume="vol2">Volume II</button>
      <button class="vol-btn" data-volume="custom">Custom</button>
    </div>

    <!-- 7-day selector -->
    <div class="weekday-track" id="workout-weekday-track">
      <button class="day-chip" data-day="mon">Mon</button>
      <button class="day-chip" data-day="tue">Tue</button>
      <button class="day-chip" data-day="wed">Wed</button>
      <button class="day-chip" data-day="thu">Thu</button>
      <button class="day-chip" data-day="fri">Fri</button>
      <button class="day-chip" data-day="sat">Sat</button>
      <button class="day-chip" data-day="sun">Sun</button>
    </div>

    <div class="workout-day-header">
      <h2 class="workout-day-title" id="workout-day-title"></h2>
      <p class="workout-day-focus" id="workout-day-focus"></p>
    </div>

    <div class="exercise-list-container" id="exercise-list"></div>
  </section>

  <!-- ═══════════════════ HISTORY VIEW ═══════════════════ -->
  <section class="view-container" id="view-log">
    <header class="view-header">
      <button class="back-btn" aria-label="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Home</span>
      </button>
      <h1 class="view-title">History</h1>
    </header>
    <div id="log-content" class="view-body"></div>
  </section>

  <!-- ═══════════════════ CUSTOMIZE VIEW ═══════════════════ -->
  <section class="view-container" id="view-customize">
    <header class="view-header">
      <button class="back-btn" aria-label="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Home</span>
      </button>
      <h1 class="view-title">Customize</h1>
    </header>
    <div id="customize-content" class="view-body"></div>
  </section>

  <!-- ═══════════════════ SETTINGS VIEW ═══════════════════ -->
  <section class="view-container" id="view-settings">
    <header class="view-header">
      <button class="back-btn" aria-label="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Home</span>
      </button>
      <h1 class="view-title">Settings</h1>
    </header>
    <div id="settings-content" class="view-body"></div>
  </section>

  <!-- ═══════════════════ SOLID DETAIL MODAL (IPHONE 13 MINI OPTIMIZED) ═══════════════════ -->
  <div class="detail-sheet-backdrop" id="detail-backdrop"></div>
  <div class="detail-sheet" id="detail-sheet">
    <div class="drag-handle" id="detail-drag-handle"></div>
    <div class="detail-modal-body" id="detail-modal-content"></div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js?v=9"></script>
  <script src="js/editor.js?v=9"></script>
  <script src="js/timer.js?v=9"></script>
  <script src="js/tracker.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
